version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DUCKDB_PATH=/app/data/processed/analytics.duckdb
      - MLFLOW_TRACKING_URI=file:///app/mlruns
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rankpilot
      POSTGRES_PASSWORD: rankpilot_pwd
      POSTGRES_DB: rankpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12
    ports:
      - "5000:5000"
    volumes:
      - mlflowdata:/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://rankpilot:rankpilot_pwd@db:5432/rankpilot
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: rankpilot
      MINIO_ROOT_PASSWORD: rankpilot_pwd
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  mlflowdata:
  miniodata:
